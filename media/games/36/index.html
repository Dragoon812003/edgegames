<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="http://127.0.0.1:8000/file/space-invaders/style.css">
    <title>Space Invader</title>
    <script src="http://127.0.0.1:8000/api/high-score-js"></script>
</head>
<body>
    <div id="main-menu">
        <img id="main-menu-screen-img" src="https://edgegames.pythonanywhere.com/file/space-invaders/main-menu-screen.png" style="width: 100vw; height: 100vh;">
        <div id="high-score-menu-text" style="position: absolute; top: 2.5vh; left: 2.5vw; color: white; font-size: x-large;"></div>
        <button id="start-btn" style="position: absolute; top: 60vh; left: 33vw; width: 125px; height: 50px; transform: translateX(-50%);">Start</button>
        <a href="https://edgegames.pythonanywhere.com/developer/MuhammadKamkoriwala"><button id="more-btn" style="position: absolute; top: 60vh; left: 50vw; width: 125px; height: 50px; transform: translateX(-50%);">More</button></a>
        <button id="leaderboard-btn" onclick="showLeaderboard()" style="position: absolute; top: 60vh; left: 66vw; width: 125px; height: 50px; transform: translateX(-50%);">Leaderboard</button>
    </div>
    <div id="game" class="hidden">
        <div id="player"></div>
        <div id="score">Score: 0</div>
        <div id="accuracy">Accuracy: 100%</div>
        <hr id="dottedLine">
        <div id="gameOverScreen" style="display: none;">
            <div id="game-over-text">Game Over</div>
            <button id="playBtn">Play Again</button>
        </div>
    </div>
    <div id="leaderboard-screen" class="hidden">
        <div id="leaderboard-title" style="font-size: 50px; margin: 25px; color: white;">Leaderboard</div>
        <div id="scores-div"></div>
        <button id="leaderboard-back-btn" onclick="handleLeaderboardBack()" style="margin-top: 25px; width: 150px;">Back</button>
    </div>
    <script src="http://127.0.0.1:8000/file/space-invaders/script.js"></script>
</body>
</html>
