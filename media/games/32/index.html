<!DOCTYPE html>
<html>
	<head>
		<title>Flappy Bird</title>
		<style>
			*{
				overflow: hidden;
				margin: 0;
				padding: 0;
			}

			#restart-button{
				position: absolute;
				top: 65vh;
				left: 50vw;
				transform: translateX(-50%);
				width: 125px;
				height: 50px;
			}

			#main-menu{
				position: absolute;
				top: 0;
				left: 0;
				width: 100vw;
				height: 100vh;
			}

			#main-menu img{
				position: absolute;
				top: 0;
				left: 0;
				width: 100vw;
				height: 100vh;
			}

			#main-menu div{
				position: absolute;
				top: 65vh;
				left: 50vw;
				transform: translateX(-50%);
				width: 50vw;
				display: flex;
				justify-content: space-between;
			}

			button {
				width: 200px;
				height: 50px;
				border: 4px solid white;
				outline: 4px solid brown;
				cursor: pointer;
				background-color: #FFC107;
				font-family: Arial;
				font-size: 20px;
				color: white;
			}

			.hidden{
				display: none;
			}
		</style>
	</head>
	<body>
		<canvas id="canvas"></canvas>
		<button id="restart-button" class="hidden" onClick="restartGame()">Restart Game</button>
		<div id="main-menu">
			<img src="https://edgegames.pythonanywhere.com/file/flappy-birds/main-menu.jpg">
			<div>
				<button onclick="startGame()">Start</button>
				<a href="https://edgegames.pythonanywhere.com/developer/MuhammadKamkoriwala"><button>More Games</button></a>
				<a href="javascript: history.go(-1)"><button>Quit</button></a>
			</div>
		</div>
		<script src="https://edgegames.pythonanywhere.com/file/flappy-birds/script.js"></script>
	</body>
</html>
